[project]
name = "dimos-worlds"
version = "0.1.0"
description = "Sim worlds, a shared-world multi-robot sim, a drone dock and deterministic replay for DimOS."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# cpu: onnxruntime, which DimOS's walking policies (and the shared-world fleet sim) run on
# manifold3d: the drone dock's meshes are generated from its spec on first use (dimos_worlds.dock)
dependencies = ["dimos[sim,unitree,cpu]==0.0.14", "numpy", "pillow", "manifold3d>=3.0"]

[project.optional-dependencies]
render = []
dev = ["pytest>=8"]

[project.scripts]
dimos-worlds-replay = "dimos_worlds.replay.replay:main"
dimos-worlds-goal = "dimos_worlds.goal:main"
dimos-worlds-send = "dimos_worlds.goal:send_main"
dimos-worlds-plant-render = "dimos_worlds.plant.pov_service:main"

# DimOS external blueprints (dimos run dimos-worlds.<name>). Each package adds its own lines here.
[project.entry-points."dimos.blueprints"]
go2-warehouse = "dimos_worlds.warehouse.blueprint:go2_warehouse"
warehouse-fleet = "dimos_worlds.fleet.blueprint:warehouse_fleet_blueprint"
warehouse-fleet-4 = "dimos_worlds.fleet.blueprint:warehouse_fleet_4_blueprint"
go2-lot-night = "dimos_worlds.lot.blueprint:go2_lot_night"
lot-cctv = "dimos_worlds.lot.cctv:LotCctv"
warehouse-arm = "dimos_worlds.arm.blueprint:warehouse_arm"
go2-plant = "dimos_worlds.plant.blueprint:go2_plant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dimos_worlds"]

[tool.hatch.build.targets.sdist]
# README media stays on GitHub; the sdist is code, scene packages and tests
exclude = ["docs/media/*.gif", "docs/media/*.jpg", "docs/media/*.png", ".github"]
