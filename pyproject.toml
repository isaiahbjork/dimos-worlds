[project]
name = "dimos-worlds"
version = "0.1.0"
description = "Sim worlds, a shared-world multi-robot sim and deterministic replay for DimOS."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# cpu: onnxruntime, which DimOS's walking policies (and the shared-world fleet sim) run on
dependencies = ["dimos[sim,unitree,cpu]==0.0.14", "numpy", "pillow"]

[project.optional-dependencies]
render = []
dev = ["pytest>=8"]

[project.scripts]
dimos-worlds-replay = "dimos_worlds.replay.replay:main"

# DimOS external blueprints (dimos run dimos-worlds.<name>). Each package adds its own lines here.
[project.entry-points."dimos.blueprints"]
go2-warehouse = "dimos_worlds.warehouse.blueprint:go2_warehouse"
warehouse-fleet = "dimos_worlds.fleet.blueprint:warehouse_fleet_blueprint"
go2-lot-night = "dimos_worlds.lot.blueprint:go2_lot_night"
lot-cctv = "dimos_worlds.lot.cctv:LotCctv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dimos_worlds"]

[tool.hatch.build.targets.sdist]
# README media stays on GitHub; the sdist is code, scene packages and tests
exclude = ["docs/media/*.gif", "docs/media/*.jpg", "docs/media/*.png", ".github"]
